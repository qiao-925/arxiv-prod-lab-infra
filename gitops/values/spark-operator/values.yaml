# ============================================================
#  Spark Operator 参数（chart: spark-operator/spark-operator 2.5.2）
# ============================================================
# 允许在 default 命名空间提交 SparkApplication
sparkJobNamespace: default

# 启用 admission webhook（校验 SparkApplication）
webhook:
  enable: true

controller:
  replicas: 1

# 镜像沿用 chart 默认（ghcr.io/kubeflow/spark-operator/controller）。
# 若网络受限，可在此覆盖为阿里云镜像：
# image:
#   registry: registry.cn-hangzhou.aliyuncs.com
#   repository: kubeflow-images/ghcr.io/kubeflow/spark-operator
#   tag: <与 chart appVersion 一致>
