# ============================================================
#  Flink Kubernetes Operator 参数（chart: flink-kubernetes-operator 1.16.0）
# ============================================================
# 只监听 flink 命名空间，避免集群级权限过大
watchNamespaces:
  - flink

# webhook 依赖 cert-manager 签发证书，保持开启
webhook:
  create: true

# 实验环境单副本
replicas: 1

# Operator 自身的 JM/TM 默认镜像走 docker.io 加速
# （containerd 已在阶段一配置好 docker.io mirror，无需改写）
