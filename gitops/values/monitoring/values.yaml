# ============================================================
#  kube-prometheus-stack 参数（chart 91.4.0 / app v0.94.0）
# ============================================================
#  刻意保持精简：只覆盖实验环境必要的项。
#  ⚠️ 不要覆盖镜像 tag —— chart 版本与镜像版本是绑定的，
#     手动改 tag 容易造成不兼容（这正是"Helm 灵活性受限"的体现）。
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2"
  service:
    type: NodePort
    nodePort: 30902

grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# 实验环境单副本，避免资源浪费
alertmanager:
  alertmanagerSpec:
    replicas: 1

# 由 chart 自带 CRD 安装
prometheusOperator:
  admissionWebhooks:
    enabled: true
