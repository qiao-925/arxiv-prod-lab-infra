# ============================================================
#  Apache Superset —— BI 可视化
# ============================================================
#  写法：单 source（chart 仓库）+ helm.values 内联参数。
#  ⚠️ 关键：chart 默认从 Scarf 遥测代理域名拉镜像
#  （apachesuperset.docker.scarf.sh），该域名不通会导致
#  ImagePullBackOff。这里覆盖回 docker.io 短名，走 containerd 加速器。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://apache.github.io/superset
    chart: superset
    targetRevision: 0.22.8
    helm:
      releaseName: superset
      values: |
        # 覆盖掉 Scarf 代理域名，改走 docker.io（阶段一已配加速器）
        image:
          repository: apache/superset
          tag: "6.1.0"

        # Superset 6.1 拒绝用默认 SECRET_KEY 启动（安全加固），必须自定义
        config:
          SECRET_KEY: "z9nKZiQud5Bttfdm2BHXgzLRE8Geoo6fm0QPOYKWKroiEfetY5TghQ9z"

        # apache/superset:6.1.0 镜像未内置 psycopg2 驱动，连接 PostgreSQL 元数据库必需。
        # 借 chart 的 bootstrapScript 钩子，在容器启动前 pip 安装（走清华 PyPI 镜像）。
        bootstrapScript: |
          #!/bin/bash
          /app/.venv/bin/python -m pip install --no-cache-dir psycopg2-binary -i https://pypi.tuna.tsinghua.edu.cn/simple

        # Argo CD 不执行 Helm hook（helm.sh/hook），会跳过 init-db Job，
        # 导致元数据库未建表 / admin 未创建。清空 jobAnnotations 去掉 hook 标注，
        # 让 init-db 变成普通 Job，由 Argo CD 正常创建执行。
        init:
          jobAnnotations: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
