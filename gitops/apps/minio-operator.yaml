# ============================================================
#  MinIO Operator —— S3 兼容对象存储（控制面）
# ============================================================
#  写法：单 source（chart 仓库）+ helm.values 内联参数。
#  wave 0 装 Operator + CRD，真正的 MinIO 实例见 minio-tenant（wave 1）。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://operator.min.io/
    chart: operator
    targetRevision: 7.1.1
    helm:
      releaseName: minio-operator
      values: |
        # 实验环境单节点，副本数从默认 2 降到 1，省内存
        operator:
          replicaCount: 1
          env:
            # 允许 Operator 管理 StatefulSet 形式的 Tenant
            - name: OPERATOR_STS_ENABLED
              value: "on"
          image:
            pullPolicy: IfNotPresent
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # MinIO/Strimzi 的 CRD 很大，客户端 apply 会超注解上限，须服务端 apply
      - ServerSideApply=true
