# ============================================================
#  cert-manager —— Flink Operator 的 webhook 依赖
# ============================================================
#  写法：单 source（chart 仓库）+ helm.values 内联参数。
#  这是被依赖项，不是业务组件。Flink Operator 的 admission
#  webhook 需要证书，没有 cert-manager 会一直起不来。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      values: |
        # cert-manager 的 CRD 不由 chart 默认安装，必须显式打开
        installCRDs: true

        # 实验环境单副本，省资源
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
