# ============================================================
#  Strimzi Kafka Operator —— 实时消息管道（控制面）
# ============================================================
#  写法：单 source（chart 仓库）+ helm.values 内联参数。
#  Operator 本体，负责把 Kafka CR 变成真正的集群。
#  真正的 Kafka 集群在 manifests/kafka-cluster/（wave 1）。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      releaseName: strimzi-kafka-operator
      values: |
        # 关键：默认 watchNamespaces 为空 = 只看自己所在命名空间。
        # 显式声明只监听 kafka 命名空间，与 Kafka CR 位置一致。
        watchNamespaces:
          - kafka

        # 实验环境单副本
        replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Strimzi 的 Kafka CRD 极大，必须服务端 apply
      - ServerSideApply=true
