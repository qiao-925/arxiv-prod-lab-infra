# ============================================================
#  DolphinScheduler —— 任务编排
# ============================================================
#  写法：单 source（git 路径 chart）+ helm.values 内联参数。
#  特殊：官方已无公开 chart 仓库，chart 本体在源码树
#  deploy/kubernetes/dolphinscheduler 下，直接用 git 路径作为 chart 源。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dolphinscheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/apache/dolphinscheduler.git
    targetRevision: 3.2.2
    path: deploy/kubernetes/dolphinscheduler
    helm:
      releaseName: dolphinscheduler
      values: |
        image:
          registry: apache
          tag: 3.2.0

        # 实验环境各角色单副本
        master:
          replicas: 1
        worker:
          replicas: 1
        alert:
          replicas: 1

        # API/UI 用 NodePort 暴露
        api:
          service:
            type: NodePort
            nodePort: 30500
  destination:
    server: https://kubernetes.default.svc
    namespace: dolphinscheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
