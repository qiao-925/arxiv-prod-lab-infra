# ============================================================
#  DolphinScheduler —— 任务编排
# ============================================================
#  特殊：官方已无公开 chart 仓库（apache.github.io/dolphinscheduler 已 404），
#  但 chart 本体在源码树的 deploy/kubernetes/dolphinscheduler 下。
#  Argo CD 支持直接以 git 路径作为 Helm chart 源 —— 仍是"现成的 helm"。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dolphinscheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/qiao-925/arxiv-prod-lab-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/apache/dolphinscheduler.git
      targetRevision: 3.2.2
      path: deploy/kubernetes/dolphinscheduler
      helm:
        releaseName: dolphinscheduler
        valueFiles:
          - $values/gitops/values/dolphinscheduler/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dolphinscheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
