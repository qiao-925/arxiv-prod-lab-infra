# ============================================================
#  DolphinScheduler —— 任务编排
# ============================================================
#  写法：单 source（git 路径 chart）+ helm.values 内联参数。
#  特殊：官方 chart 的 bitnami 依赖指向 archive-full-index（45MB 索引），
#  Argo CD 每次 helm dependency build 都会超时。故把 chart 连同 4 个
#  依赖 tarball 一起 vendoring 进本仓库（gitops/charts/dolphinscheduler/），
#  helm template 直接命中本地 charts/ 目录，不再联网拉依赖。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dolphinscheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/qiao-925/arxiv-prod-lab-infra.git
    targetRevision: main
    path: gitops/charts/dolphinscheduler
    helm:
      releaseName: dolphinscheduler
      values: |
        image:
          registry: apache
          tag: 3.2.0

        # 内置依赖的 bitnami 老标签（bitnami/postgresql:11.11.0 等）已下架，
        # 统一换成 bitnamilegacy/* 等价标签（同架构，已验证镜像源可达）
        postgresql:
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: 14.17.0-debian-12-r3
          # ⚠️ 默认用 emptyDir（无持久化），pod 一重启元数据库 schema 就丢（t_ds_* 全没）。
          # 必须开 PVC，否则每次重启都要重跑 schema 初始化。
          persistence:
            enabled: true
            size: "20Gi"
            # 不能用 "-"（会被渲染成 storageClassName:"" = 禁用动态供应，PVC 卡 Pending）。
            # 显式用 k3s 默认的 local-path。
            storageClass: "local-path"
        zookeeper:
          image:
            registry: docker.io
            repository: bitnamilegacy/zookeeper
            tag: 3.8.1-debian-11-r0
        minio:
          image:
            registry: docker.io
            repository: bitnamilegacy/minio
            tag: 2022.10.29-debian-11-r0
          persistence:
            enabled: true

        # 实验环境各角色单副本
        master:
          replicas: 1
        worker:
          replicas: 1
        alert:
          replicas: 1

        # API/UI 用 NodePort 暴露
        api:
          service:
            type: NodePort
            nodePort: 30500
  destination:
    server: https://kubernetes.default.svc
    namespace: dolphinscheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # K8s 会给 StatefulSet 的 volumeClaimTemplates 自动回填 apiVersion/kind/volumeMode/status
  # （PVC 状态反射），Helm 渲染的 target 里没有这些字段，导致 Argo CD 永远报 OutOfSync（幽灵 diff）。
  # 这里显式忽略这些自动回填字段。
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: dolphinscheduler-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/volumeMode
        - /spec/volumeClaimTemplates/0/status
