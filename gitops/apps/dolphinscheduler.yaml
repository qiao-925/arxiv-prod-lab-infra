# ============================================================
#  DolphinScheduler —— 任务编排
# ============================================================
#  写法：单 source（git 路径 chart）+ helm.values 内联参数。
#  特殊：官方已无公开 chart 仓库，chart 本体在源码树
#  deploy/kubernetes/dolphinscheduler 下，直接用 git 路径作为 chart 源。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dolphinscheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/apache/dolphinscheduler.git
    targetRevision: 3.2.2
    path: deploy/kubernetes/dolphinscheduler
    helm:
      releaseName: dolphinscheduler
      values: |
        image:
          registry: apache
          tag: 3.2.0

        # 内置依赖的 bitnami 老标签（bitnami/postgresql:11.11.0 等）已下架，
        # 统一换成 bitnamilegacy/* 等价标签（同架构，已验证镜像源可达）
        postgresql:
          image:
            registry: docker.io
            repository: bitnamilegacy/postgresql
            tag: 14.17.0-debian-12-r3
        zookeeper:
          image:
            registry: docker.io
            repository: bitnamilegacy/zookeeper
            tag: 3.8.1-debian-11-r0
        minio:
          image:
            registry: docker.io
            repository: bitnamilegacy/minio
            tag: 2022.10.29-debian-11-r0

        # 实验环境各角色单副本
        master:
          replicas: 1
        worker:
          replicas: 1
        alert:
          replicas: 1

        # API/UI 用 NodePort 暴露
        api:
          service:
            type: NodePort
            nodePort: 30500
  destination:
    server: https://kubernetes.default.svc
    namespace: dolphinscheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
